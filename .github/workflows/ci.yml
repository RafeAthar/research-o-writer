name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: research_o_writer
          POSTGRES_USER: row
          POSTGRES_PASSWORD: row_dev_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U row -d research_o_writer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: research_o_writer
      POSTGRES_USER: row
      POSTGRES_PASSWORD: row_dev_password
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      APP_AUTH_TOKEN: ci-test-token-please-rotate
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies (lite)
        run: |
          pip install --upgrade pip
          # Install without heavy ML deps to keep CI fast.
          pip install fastapi uvicorn pydantic pydantic-settings \
            'sqlalchemy[asyncio]' asyncpg alembic pgvector python-multipart \
            httpx anthropic boto3 rq redis python-slugify tiktoken tenacity \
            pytest pytest-asyncio ruff
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Test
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
          NEXT_PUBLIC_AUTH_TOKEN: ci-test-token-please-rotate
